[project]
name = "cmp-dbx-fe"
version = "0.1.0"
description = "Crypto Market Pulse on Databricks Free Edition, with a local Redpanda + Spark + MiniLake loop"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyyaml>=6",
  "python-dotenv>=1",
  "confluent-kafka>=2.5",
  "websockets>=13",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
spark = ["pyspark>=4.0,<4.1", "delta-spark>=4.0,<4.1"]
minilake = ["databricks-sdk>=0.60,<1"]

[tool.uv]
default-groups = ["dev", "spark", "minilake"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "spark: local Spark + Delta (downloads Maven jars on first run)",
  "integration: needs local Redpanda (just up) and Spark",
  "minilake: needs local MiniLake (just up)",
]
addopts = "-m 'not spark and not integration and not minilake'"

[tool.ruff]
line-length = 110
