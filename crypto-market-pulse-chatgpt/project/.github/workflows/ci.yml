name: CI
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q src scripts dashboards tests
      - run: ruff check src scripts tests --select E4,E7,E9,F63,F7,F82
      - run: PYTHONPATH=src pytest -q tests --ignore=tests/test_beam_optional.py
      - run: python scripts/build_databricks_dashboard.py
      - run: git diff --exit-code dashboards/market_pulse.lvdash.json
      - run: python -m zipfile -t baseline/weather_dfe_handoff.zip
  beam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-beam.txt pytest
      - run: PYTHONPATH=src pytest -q tests/test_beam_optional.py
  # Docker/Colima and cloud integration are intentionally NOT run in PR CI.
  # See docs/SPEC.md for manual E2E acceptance and cost control.
